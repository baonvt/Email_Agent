# Local development only. Visual Studio can add its generated debug overrides.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  project_ai.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      AuthWeb__AllowInsecureCookiesForDevelopment: "true"
      Database__MigrateOnStartup: "true"
    ports:
      - "127.0.0.1:8080:8080"
