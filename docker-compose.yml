services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inboxagent
      POSTGRES_USER: inboxagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inboxagent -d inboxagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  project_ai.api:
    image: ${DOCKER_REGISTRY-}projectaiapi
    build:
      context: .
      dockerfile: Project_AI/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=inboxagent;Username=inboxagent;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      AuthWeb__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
      Email__FrontendBaseUrl: ${FRONTEND_ORIGIN:-http://localhost:3000}
      Email__DeliveryEnabled: ${SENDGRID_DELIVERY_ENABLED:-false}
      Email__ApiKey: ${SENDGRID_API_KEY:-}
      Email__FromEmail: ${SENDGRID_FROM_EMAIL:-}
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  postgres-data:
  redis-data:
  dataprotection-keys:
